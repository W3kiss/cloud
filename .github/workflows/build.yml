name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [feat-ui-authors-tweaks, main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release
        continue-on-error: false

      - name: Clippy (non-blocking)
        working-directory: src-tauri
        run: cargo clippy --release
        continue-on-error: true

      - name: Svelte type check (non-blocking)
        run: npx svelte-kit sync && npx svelte-check --threshold error
        continue-on-error: true

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: setup-hub-windows
          path: |
            src-tauri/target/release/setup-hub.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
